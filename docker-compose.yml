services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:${RUSTFS_IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-}
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
    ports:
      # Keep the dev S3 API and console on loopback; containers use the
      # compose network at rustfs:9000.
      - "${RUSTFS_S3_BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot provisioning: creates the private photo bucket, the scoped
  # application policy, and the application user. Safe to re-run.
  rustfs-init:
    image: rustfs/rc:${RUSTFS_CLI_IMAGE_TAG:-v0.1.36}
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_INTERNAL_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-clinic-photos}
    entrypoint: ["/bin/sh", "/opt/rustfs/init.sh"]
    volumes:
      - ./deploy/rustfs/init.sh:/opt/rustfs/init.sh:ro

  backend:
    image: ghcr.io/bitnp/clinic-backend:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      CLINIC_DB_DRIVER: ${CLINIC_DB_DRIVER:-postgres}
      CLINIC_DB_DSN: ${CLINIC_DB_DSN:-postgres://clinic:clinic@db:5432/clinic?sslmode=disable}
      CLINIC_API_KEY: ${CLINIC_API_KEY:-local-dev-key}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Shanghai}
      SYNC_POLL_INTERVAL: ${SYNC_POLL_INTERVAL:-10s}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      CAS_SERVER_URL: ${CAS_SERVER_URL:-}
      CAS_HTTP_TIMEOUT: ${CAS_HTTP_TIMEOUT:-10s}
      CAS_DEFAULT_REDIRECT: ${CAS_DEFAULT_REDIRECT:-/}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sessionid}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-csrf_token}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_TTL: ${SESSION_TTL:-336h}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      TAGGER_URL: ${TAGGER_URL:-http://127.0.0.1:4514}
      TAGGER_API_TOKEN: ${TAGGER_API_TOKEN:-}
      TAGGER_TAG_SET: ${TAGGER_TAG_SET:-clinic_record}
      LM_TAGGER_TAG_SET: ${LM_TAGGER_TAG_SET:-clinic_laptop_liquid_metal}
      TAGGER_TIMEOUT: ${TAGGER_TIMEOUT:-15s}
      RECORD_ACTION_WINDOW: ${RECORD_ACTION_WINDOW:-5m}
      RECORD_PHOTO_MAX_COUNT: ${RECORD_PHOTO_MAX_COUNT:-9}
      RECORD_PHOTO_MAX_SIZE_BYTES: ${RECORD_PHOTO_MAX_SIZE_BYTES:-10485760}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_PUT_URL_TTL: ${S3_PUT_URL_TTL:-5m}
      S3_GET_URL_TTL: ${S3_GET_URL_TTL:-10m}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
  rustfsdata:
