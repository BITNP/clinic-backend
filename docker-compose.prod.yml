version: "3"

# Production deployment: runs pre-built images — no local build.
# Runs the backend, the admin frontend, Redis and RustFS as a single stack.
# Uses the Postgres already running on the server (host.containers.internal:5432),
# same as the other clinic services. Redis and RustFS are bundled as compose
# services here (reachable at redis:6379 and rustfs:9000 on the compose network,
# no host ports) and are loaded from locally packaged image tarballs rather than
# pulled from a registry.
#
# Podman alternative (rootless, same compose file):
#   systemctl --user enable --now podman.socket
#   podman-compose -f docker-compose.prod.yml up -d
#
# Usage on the server (only this file + .env + the image tarball are needed):
#   docker load -i clinic-images.tar
#   cp .env.example .env            # then set real secrets:
#                                   #   CLINIC_API_KEY, APP_BASE_URL,
#                                   #   CAS_SERVER_URL, CLINIC_DB_DSN, ...
#   docker compose -f docker-compose.prod.yml up -d
#
# Pin a specific image version with BACKEND_IMAGE_TAG / ADMIN_FRONTEND_IMAGE_TAG,
# e.g. BACKEND_IMAGE_TAG=1.2.3
#
# The frontend (Caddy on :5173) proxies /api, /login, /logout to the backend over
# the compose network (backend:8080), so the backend needs no host port. If you
# want to reach the backend directly (or run it standalone), expose it with:
#   ports:
#     - "8080:8080"

services:
  redis:
    image: redis:7-alpine
    # The image is shipped to the server in the packaged tarball, never pulled.
    pull_policy: never
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    # The image is shipped to the server in the packaged tarball, never pulled.
    pull_policy: never
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # Override these in .env so the backend does not run with the public
      # defaults. RustFS has no host port here (compose network only), but the
      # credentials still guard the stored objects.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-clinic}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-clinic-secret}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/bitnp/clinic-backend:${BACKEND_IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      CLINIC_DB_DRIVER: postgres
      CLINIC_DB_DSN: ${CLINIC_DB_DSN:-postgres://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@host.containers.internal:5432/${POSTGRES_DB:-clinic}?sslmode=disable}
      CLINIC_API_KEY: ${CLINIC_API_KEY:?set CLINIC_API_KEY in .env}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-clinic}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-clinic-secret}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-clinic}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      CAS_SERVER_URL: ${CAS_SERVER_URL:-}
      CAS_HTTP_TIMEOUT: ${CAS_HTTP_TIMEOUT:-10s}
      CAS_DEFAULT_REDIRECT: ${CAS_DEFAULT_REDIRECT:-/}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sessionid}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-csrf_token}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_TTL: ${SESSION_TTL:-336h}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      TAGGER_URL: ${TAGGER_URL:-http://127.0.0.1:4514}
      TAGGER_API_TOKEN: ${TAGGER_API_TOKEN:-}
      TAGGER_TAG_SET: ${TAGGER_TAG_SET:-clinic_record}
      TAGGER_TIMEOUT: ${TAGGER_TIMEOUT:-15s}
      RECORD_ACTION_WINDOW: ${RECORD_ACTION_WINDOW:-5m}
    restart: unless-stopped

  admin-frontend:
    image: ghcr.io/bitnp/clinic_admin_frontend:${ADMIN_FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Caddy proxies /api, /login, /logout here; defaults to the backend
      # service on the compose network.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8080}
    ports:
      - "${ADMIN_FRONTEND_PORT:-5173}:80"

volumes:
  redisdata:
  rustfsdata:
