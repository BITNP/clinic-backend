version: "3"

# Production deployment: runs pre-built images — no local build.
# Runs the backend, the admin frontend, Redis and RustFS object storage as a
# single stack.
# Uses the Postgres already running on the server (host.containers.internal:5432),
# same as the other clinic services. Redis and RustFS are bundled as compose
# services (reachable at redis:6379 and rustfs:9000 on the compose network) and
# are loaded from locally packaged image tarballs rather than pulled from a
# registry.
#
# Podman alternative (rootless, same compose file):
#   systemctl --user enable --now podman.socket
#   podman-compose -f docker-compose.prod.yml up -d
#
# Usage on the server (only this file, .env, deploy/rustfs/ and the image
# tarball are needed):
#   docker load -i clinic-images.tar
#   cp .env.example .env            # then set real secrets:
#                                   #   CLINIC_API_KEY, APP_BASE_URL,
#                                   #   CAS_SERVER_URL, CLINIC_DB_DSN,
#                                   #   RUSTFS_*, S3_*, ...
#   docker compose -f docker-compose.prod.yml up -d
#
# Pin specific image versions with BACKEND_IMAGE_TAG / ADMIN_FRONTEND_IMAGE_TAG /
# RUSTFS_IMAGE_TAG / RUSTFS_CLI_IMAGE_TAG, e.g.
# BACKEND_IMAGE_TAG=1.2.3, RUSTFS_IMAGE_TAG=1.0.3.
#
# RustFS operations (bucket setup, credential rotation, backup/restore) are
# documented in deploy/rustfs/README.md.
#
# The frontend (Caddy on :5173) proxies /api, /login, /logout to the backend over
# the compose network (backend:8080), so the backend needs no host port. If you
# want to reach the backend directly (or run it standalone), expose it with:
#   ports:
#     - "8080:8080"

services:
  redis:
    image: redis:7-alpine
    # The image is shipped to the server in the packaged tarball, never pulled.
    pull_policy: never
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:${RUSTFS_IMAGE_TAG:-1.0.3}
    # The image is shipped to the server in the packaged tarball, never pulled.
    pull_policy: never
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-}
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
    ports:
      # Loopback-only ports. Reach the console through an SSH tunnel:
      #   ssh -L 9001:127.0.0.1:9001 server
      # The S3 API is available to host tooling on 127.0.0.1; it is never
      # published on a public interface.
      - "${RUSTFS_S3_BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot provisioning: creates the private photo bucket, the scoped
  # application policy, and the application user. Safe to re-run.
  rustfs-init:
    image: rustfs/rc:${RUSTFS_CLI_IMAGE_TAG:-v0.1.36}
    # The image is shipped to the server in the packaged tarball, never pulled.
    pull_policy: never
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_INTERNAL_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-clinic-photos}
    entrypoint: ["/bin/sh", "/opt/rustfs/init.sh"]
    volumes:
      - ./deploy/rustfs/init.sh:/opt/rustfs/init.sh:ro

  backend:
    image: ghcr.io/bitnp/clinic-backend:${BACKEND_IMAGE_TAG:-latest}
    # The image is shipped to the server in the packaged tarball, never pulled.
    pull_policy: never
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      CLINIC_DB_DRIVER: postgres
      CLINIC_DB_DSN: ${CLINIC_DB_DSN:-postgres://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@host.containers.internal:5432/${POSTGRES_DB:-clinic}?sslmode=disable}
      CLINIC_API_KEY: ${CLINIC_API_KEY:?set CLINIC_API_KEY in .env}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Shanghai}
      SYNC_POLL_INTERVAL: ${SYNC_POLL_INTERVAL:-10s}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      CAS_SERVER_URL: ${CAS_SERVER_URL:-}
      CAS_HTTP_TIMEOUT: ${CAS_HTTP_TIMEOUT:-10s}
      CAS_DEFAULT_REDIRECT: ${CAS_DEFAULT_REDIRECT:-/}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sessionid}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-csrf_token}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_TTL: ${SESSION_TTL:-336h}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      TAGGER_URL: ${TAGGER_URL:-http://127.0.0.1:4514}
      TAGGER_API_TOKEN: ${TAGGER_API_TOKEN:-}
      TAGGER_TAG_SET: ${TAGGER_TAG_SET:-clinic_record}
      LM_TAGGER_TAG_SET: ${LM_TAGGER_TAG_SET:-clinic_laptop_liquid_metal}
      TAGGER_TIMEOUT: ${TAGGER_TIMEOUT:-15s}
      RECORD_ACTION_WINDOW: ${RECORD_ACTION_WINDOW:-5m}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_PUT_URL_TTL: ${S3_PUT_URL_TTL:-5m}
      S3_GET_URL_TTL: ${S3_GET_URL_TTL:-10m}
    restart: unless-stopped

  admin-frontend:
    image: ghcr.io/bitnp/clinic_admin_frontend:${ADMIN_FRONTEND_IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Caddy proxies /api, /login, /logout here; defaults to the backend
      # service on the compose network.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8080}
    ports:
      - "${ADMIN_FRONTEND_PORT:-5173}:80"

volumes:
  redisdata:
  rustfsdata:
